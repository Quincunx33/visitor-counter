<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c16">
<meta name="description" content="A simple visitor counter API for GitHub READMEs and websites.">
<title>VisCount — Visitor Counter</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#111a2b;--line:#263650;--muted:#8e9db5;--cyan:#77e5ee;--blue:#9caeff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1b3150 0,transparent 55%),var(--bg);color:#eef5ff;font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column}
header{width:min(760px,calc(100% - 32px));margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand{font-size:19px;font-weight:800;letter-spacing:-.5px}.mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#07111c}.docs{color:var(--muted);font-size:13px;text-decoration:none}.docs:hover{color:var(--cyan)}
main{width:min(600px,calc(100% - 32px));margin:auto;text-align:center;padding:36px 0 70px;animation:rise .65s ease both}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #77e5ee44;background:#77e5ee0c;color:var(--cyan);padding:6px 11px;border-radius:30px;font-size:11px;letter-spacing:.3px}.pulse{width:7px;height:7px;background:#85e9ae;border-radius:50%;box-shadow:0 0 12px #85e9ae;animation:pulse 1.8s infinite}
h1{font-size:clamp(40px,9vw,62px);line-height:1.04;letter-spacing:-2.8px;margin:20px 0 12px}.shine{background:linear-gradient(100deg,#fff 15%,var(--cyan) 48%,var(--blue) 80%);background-size:200% auto;background-clip:text;color:transparent;animation:shine 5s linear infinite}main>p{color:var(--muted);margin:0 auto 28px;max-width:440px}
.panel{padding:22px;text-align:left;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#131f32dd,#0e1727ee);box-shadow:0 24px 70px #0005;backdrop-filter:blur(12px)}
label{display:block;color:#b5c3d8;font-size:12px;margin:0 0 8px}input{width:100%;border:1px solid #34445f;border-radius:10px;background:#080f1c;color:white;padding:13px 14px;font:inherit;outline:none;transition:border .2s,box-shadow .2s}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #77e5ee18}
.preview{min-height:112px;display:grid;place-items:center;margin:15px 0;border:1px dashed #34445c;border-radius:11px;background:#080f1b;padding:16px}.preview img{display:block;max-width:100%;height:auto}.preview-error{color:var(--muted);font-size:12px;text-align:center;line-height:1.7}.preview-error a{color:var(--cyan);text-decoration:none}.status{font-size:11px;color:var(--muted);text-align:center;margin-top:-7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:#18263c;color:#eaf3ff;font-size:12px;font-weight:700;cursor:pointer;transition:transform .2s,border-color .2s}.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.btn.primary{background:linear-gradient(110deg,var(--cyan),var(--blue));color:#07111c;border:0}
.snippet{margin-top:14px;padding:12px;border-radius:10px;background:#080f1b;border:1px solid #25354b;display:flex;align-items:center;gap:10px}.snippet code{font:11px/1.5 ui-monospace,monospace;color:#bdebf0;overflow-wrap:anywhere;flex:1;text-align:left}.snippet button{flex:none;border:1px solid #34445b;border-radius:7px;background:#17243a;color:#fff;padding:7px 9px;font-size:11px;cursor:pointer}.toast{min-height:18px;margin-top:9px;text-align:center;font-size:11px;color:var(--cyan)}.btn:focus-visible,.snippet button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
footer{margin-top:auto;text-align:center;padding:20px;color:#65748c;font-size:11px}footer a{color:#93a6c2;text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.45;box-shadow:0 0 3px #85e9ae}}@keyframes shine{to{background-position:200% center}}
@media(max-width:420px){.panel{padding:16px}.actions{grid-template-columns:1fr}.snippet{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><a class="brand" href="#"><span class="mark">V</span>VisCount</a><a class="docs" href="https://viscount-inzm9sse.manus.space/api/v1/docs" target="_blank" rel="noreferrer">API Docs ↗</a></header>
<main>
<div class="pill"><span class="pulse"></span> SIMPLE · FREE · DEVELOPER FRIENDLY</div>
<h1>Your visits,<br><span class="shine">beautifully counted.</span></h1>
<p>Create a visitor badge for your GitHub README or website in seconds.</p>
<div class="panel">
<label for="username">YOUR USERNAME</label>
<input id="username" value="quincunx33" maxlength="64" placeholder="Enter username" autocomplete="off" spellcheck="false">
<div class="preview"><img id="badge" alt="Visitor counter badge"><div id="fallback" class="preview-error" hidden>Could not load the live badge.<br><a id="openBadge" href="#" target="_blank" rel="noreferrer">Open SVG directly ↗</a> · <a href="#" id="retry">Try again</a></div></div>
<div class="status" id="status" aria-live="polite">Loading preview…</div>
<div class="actions"><button class="btn primary" id="copyMarkdown">Copy README Badge</button><button class="btn" id="copyUrl">Copy SVG Link</button></div>
<div class="snippet"><code id="snippet"></code></div><div class="toast" id="toast" aria-live="polite"></div>
</div>
</main>
<footer>Powered by <a href="https://viscount-inzm9sse.manus.space/api/v1/docs" target="_blank" rel="noreferrer">VisCount API</a> · Made for developers</footer>
<script>
const BASE='https://viscount-inzm9sse.manus.space', $=id=>document.getElementById(id);
function getData(){const username=$('username').value.trim().replace(/[^a-zA-Z0-9_.-]/g,'')||'YOUR_USERNAME';const url=BASE+'/api/v1/counter/'+encodeURIComponent(username)+'.svg';return{username,url,markdown:'![Visitor Count]('+url+')'}}
function render(){const d=getData();$('snippet').textContent=d.markdown;$('openBadge').href=d.url;$('badge').hidden=false;$('fallback').hidden=true;$('status').textContent='Loading live preview…';$('badge').src=d.url+'?t='+Date.now()}
$('username').addEventListener('input',render);
$('badge').addEventListener('load',()=>{$('status').textContent='Live badge preview';$('fallback').hidden=true});
$('badge').addEventListener('error',()=>{$('badge').hidden=true;$('fallback').hidden=false;$('status').textContent='Preview unavailable — the API may be temporarily unreachable'});
$('retry').addEventListener('click',e=>{e.preventDefault();render()});
async function copy(value,button,label){const original=label;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);ok=true}}catch{}if(!ok){const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{ok=document.execCommand('copy')}catch{}area.remove()}$('toast').textContent=ok?'Copied to clipboard.':'Copy failed. Please select and copy the text manually.';button.textContent=ok?'Copied!':'Try again';setTimeout(()=>button.textContent=original,1500)}
$('copyMarkdown').addEventListener('click',()=>copy(getData().markdown,$('copyMarkdown'),'Copy README Badge'));
$('copyUrl').addEventListener('click',()=>copy(getData().url,$('copyUrl'),'Copy SVG Link'));
render();
</script>
</body></html>
